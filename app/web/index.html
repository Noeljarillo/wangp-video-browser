<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#252525">
<title>WanGP Video Browser</title>
<script>
  // Runs before first paint: a stylesheet can't restore last session's theme or
  // panel width without the page flashing the default first.
  try {
    var saved = localStorage.getItem("wvb-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    var w = parseInt(localStorage.getItem("wvb-sidebar"), 10);
    if (w >= 260 && w <= 560) document.documentElement.style.setProperty("--sidebar-w", w + "px");
    if (localStorage.getItem("wvb-rail") === "1") document.documentElement.dataset.rail = "1";
  } catch (e) { /* private mode - fall back to the defaults */ }
</script>
<!-- Inline so the tab has a mark without a round trip, and without a 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231473e6'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.2' stroke-linejoin='round'%3E%3Crect x='3.4' y='4.2' width='9.2' height='7.6' rx='.9'/%3E%3Cpath d='M5.9 4.2v7.6M10.1 4.2v7.6M3.4 8h9.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/ibm-plex-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/library.css">
<link rel="stylesheet" href="/static/grid.css">
</head>
<body>

<!-- Icon set, drawn on a 16px grid at a 1.4px stroke so the weight matches the type. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" class="sprite">
  <defs>
    <g id="i-play"><path d="M5.2 3.3 12.9 8l-7.7 4.7z" fill="currentColor" stroke="none"/></g>
    <g id="i-pause"><path d="M6.1 3.6v8.8M9.9 3.6v8.8" stroke-width="1.9"/></g>
    <g id="i-start"><path d="M4.2 3.6v8.8"/><path d="M12.6 4.1 6.6 8l6 3.9z" fill="currentColor" stroke-linejoin="round"/></g>
    <g id="i-volume"><path d="M8.4 3.4 5.4 6H3.3v4h2.1l3 2.6z" stroke-linejoin="round"/><path d="M10.8 6.3a2.4 2.4 0 0 1 0 3.4"/><path d="M12.6 4.7a5 5 0 0 1 0 6.6"/></g>
    <g id="i-mute"><path d="M8.4 3.4 5.4 6H3.3v4h2.1l3 2.6z" stroke-linejoin="round"/><path d="M10.8 6.6 13.6 9.4M13.6 6.6l-2.8 2.8"/></g>
    <g id="i-expand"><path d="M6.1 2.9H2.9V6.1M9.9 2.9h3.2V6.1M13.1 9.9v3.2H9.9M2.9 9.9v3.2h3.2"/></g>
    <g id="i-close"><path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8"/></g>
    <g id="i-refresh"><path d="M12.9 8a4.9 4.9 0 1 1-1.6-3.6"/><path d="M13.1 2.3v2.9h-2.9"/></g>
    <g id="i-sun"><circle cx="8" cy="8" r="2.7"/><path d="M8 1.4v1.4M8 13.2v1.4M1.4 8h1.4M13.2 8h1.4M3.3 3.3l1 1M11.7 11.7l1 1M12.7 3.3l-1 1M4.3 11.7l-1 1"/></g>
    <g id="i-moon"><path d="M13.2 9.7A5.7 5.7 0 0 1 6.3 2.8 5.7 5.7 0 1 0 13.2 9.7z" stroke-linejoin="round"/></g>
    <g id="i-down"><path d="M4.3 6.3 8 10l3.7-3.7"/></g>
    <g id="i-left"><path d="M9.7 3.4 5.1 8l4.6 4.6"/></g>
    <g id="i-link"><path d="M6.7 9.3a2.6 2.6 0 0 0 3.7 0l2-2a2.6 2.6 0 1 0-3.7-3.7l-.8.8"/><path d="M9.3 6.7a2.6 2.6 0 0 0-3.7 0l-2 2a2.6 2.6 0 1 0 3.7 3.7l.8-.8"/></g>
    <g id="i-copy"><path d="M6.1 6.1h6.4v6.4H6.1z" stroke-linejoin="round"/><path d="M10 6.1V4.2a.7.7 0 0 0-.7-.7H4.2a.7.7 0 0 0-.7.7v5.1a.7.7 0 0 0 .7.7h1.9"/></g>
    <g id="i-loop"><path d="M3.4 7.2V6.3a2 2 0 0 1 2-2h7.2"/><path d="M10.9 2.5 12.9 4.3 10.9 6.1"/><path d="M12.6 8.8v.9a2 2 0 0 1-2 2H3.4"/><path d="M5.1 9.9 3.1 11.7l2 1.8"/></g>
    <g id="i-loop-off"><path d="M3.4 7.2V6.3a2 2 0 0 1 2-2h7.2"/><path d="M10.9 2.5 12.9 4.3 10.9 6.1"/><path d="M12.6 8.8v.9a2 2 0 0 1-2 2H3.4"/><path d="M5.1 9.9 3.1 11.7l2 1.8"/><path d="M2.6 2.6 13.4 13.4" stroke-width="1.7"/></g>
    <g id="i-search"><circle cx="7.2" cy="7.2" r="3.9"/><path d="M10.1 10.1 13.3 13.3"/></g>
    <g id="i-plus"><path d="M8 3.9v8.2M3.9 8h8.2"/></g>
    <g id="i-check"><path d="M3.6 8.4 6.5 11.3 12.4 4.9"/></g>
    <g id="i-folder"><path d="M2.6 11.9V4.1a.8.8 0 0 1 .8-.8h2.4l1.3 1.7h5.5a.8.8 0 0 1 .8.8v6.1a.8.8 0 0 1-.8.8H3.4a.8.8 0 0 1-.8-.8z" stroke-linejoin="round"/></g>
    <g id="i-film"><rect x="2.4" y="3.3" width="11.2" height="9.4" rx="1.1"/><path d="M5.4 3.3v9.4M10.6 3.3v9.4M2.4 8h11.2"/></g>
    <g id="i-compare"><rect x="2.4" y="3.6" width="5" height="8.8" rx=".9"/><path d="M8.6 3.6h4.1a.9.9 0 0 1 .9.9v7a.9.9 0 0 1-.9.9H8.6" stroke-dasharray="2.4 1.7"/></g>
    <g id="i-panel"><rect x="2.4" y="3.1" width="11.2" height="9.8" rx="1.1"/><path d="M6.6 3.1v9.8"/></g>
    <g id="i-image"><rect x="2.4" y="3.3" width="11.2" height="9.4" rx="1.1"/><path d="m2.9 11.2 3-3.1 2.2 2.1 2.4-2.6 2.6 2.7"/><circle cx="6" cy="6.2" r="1"/></g>
    <g id="i-drop"><path d="M8 2.9v6.8"/><path d="M5.3 7 8 9.7 10.7 7"/><path d="M3.1 11.4v.9a.8.8 0 0 0 .8.8h8.2a.8.8 0 0 0 .8-.8v-.9"/></g>
    <g id="i-wipe"><rect x="2.4" y="3.6" width="11.2" height="8.8" rx="1"/><path d="M8 3.6v8.8" stroke-width="1.8"/><path d="M5.6 8h-1.7M4.6 6.9 3.4 8l1.2 1.1M10.4 8h1.7M11.4 6.9 12.6 8l-1.2 1.1"/></g>
    <g id="i-blink"><rect x="2.4" y="3.6" width="11.2" height="8.8" rx="1"/><path d="M5.8 6.2 4 8l1.8 1.8M10.2 6.2 12 8l-1.8 1.8"/></g>
  </defs>
</svg>

<header id="topbar">
  <a class="wordmark" href="/">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" class="ic"><use href="#i-film"/></svg></span>
    <span class="wordmark-text">WanGP <b>Video&nbsp;Browser</b></span>
  </a>

  <button id="railToggle" class="ghost ic-btn only-desktop" aria-label="Collapse the library panel" title="Collapse library">
    <svg viewBox="0 0 16 16" class="ic"><use href="#i-panel"/></svg>
  </button>

  <nav class="tabs only-desktop" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-preview" aria-controls="view-preview" data-view="preview" aria-selected="true">Preview</button>
    <button class="tab" role="tab" id="tab-compare" aria-controls="view-compare" data-view="compare" aria-selected="false">Compare<span class="tab-count" id="cmpCount" hidden>0</span></button>
    <button class="tab" role="tab" id="tab-folders" aria-controls="view-folders" data-view="folders" aria-selected="false">Folders</button>
  </nav>

  <div class="spacer"></div>
  <span class="status" id="status" role="status">Loading library…</span>
  <button id="themeToggle" class="ghost ic-btn" aria-label="Switch colour theme" title="Switch theme">
    <svg viewBox="0 0 16 16" class="ic when-light"><use href="#i-moon"/></svg>
    <svg viewBox="0 0 16 16" class="ic when-dark"><use href="#i-sun"/></svg>
  </button>
  <button id="rescan" class="ghost ic-btn" aria-label="Rescan folders" title="Rescan folders">
    <svg viewBox="0 0 16 16" class="ic"><use href="#i-refresh"/></svg>
  </button>
</header>

<main>
  <aside id="sidebar" aria-label="Library">
    <div class="filters">
      <div class="field">
        <svg viewBox="0 0 16 16" class="ic field-ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="search" placeholder="Search prompt, seed, model, filename" aria-label="Search the library">
      </div>
      <div class="filter-row">
        <div class="select">
          <select id="sort" aria-label="Sort order">
            <option value="mtime">Newest first</option>
            <option value="mtime_asc">Oldest first</option>
            <option value="name">Name</option>
            <option value="size">Largest</option>
            <option value="duration">Longest</option>
            <option value="gentime">Slowest to generate</option>
          </select>
          <svg viewBox="0 0 16 16" class="ic" aria-hidden="true"><use href="#i-down"/></svg>
        </div>
      </div>
      <div class="facets" id="facets" role="group" aria-label="Filters" hidden></div>
    </div>
    <div id="list" role="list"></div>
    <div id="tray" hidden>
      <span class="tray-count"><b id="trayCount">0</b> picked</span>
      <button id="pickVisible" class="ghost sm">Top 2</button>
      <button id="clearPicks" class="ghost sm">Clear</button>
      <button id="goCompare" class="accent sm">Compare</button>
    </div>
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the library panel" tabindex="0"></div>
  </aside>

  <section id="content">
    <button id="sheetBack" class="sheet-back only-mobile" aria-label="Back to library">
      <svg viewBox="0 0 16 16" class="ic"><use href="#i-left"/></svg><span>Library</span>
    </button>
    <div class="view" id="view-preview" role="tabpanel" aria-labelledby="tab-preview" tabindex="0"></div>
    <div class="view" id="view-compare" role="tabpanel" aria-labelledby="tab-compare" tabindex="0"></div>
    <div class="view" id="view-folders" role="tabpanel" aria-labelledby="tab-folders" tabindex="0"></div>
  </section>
</main>

<nav id="tabbar" class="only-mobile" role="tablist" aria-label="Views">
  <button class="tabbar-btn" role="tab" aria-controls="view-preview" data-view="preview" aria-selected="true">
    <svg viewBox="0 0 16 16" class="ic"><use href="#i-film"/></svg><span>Library</span>
  </button>
  <button class="tabbar-btn" role="tab" aria-controls="view-compare" data-view="compare" aria-selected="false">
    <svg viewBox="0 0 16 16" class="ic"><use href="#i-compare"/></svg><span>Compare</span>
    <i class="dot" id="cmpDot" hidden></i>
  </button>
  <button class="tabbar-btn" role="tab" aria-controls="view-folders" data-view="folders" aria-selected="false">
    <svg viewBox="0 0 16 16" class="ic"><use href="#i-folder"/></svg><span>Folders</span>
  </button>
</nav>

<div id="dropveil" aria-hidden="true">
  <div class="dropveil-card">
    <svg viewBox="0 0 16 16" class="ic"><use href="#i-drop"/></svg>
    <span>Drop video files to compare them</span>
  </div>
</div>

<input type="file" id="filePicker" accept="video/*" multiple hidden>
<script src="/static/grid.js"></script>
<script src="/static/app.js"></script>
<script src="/static/takes.js"></script>
<script src="/static/library.js"></script>
</body>
</html>
