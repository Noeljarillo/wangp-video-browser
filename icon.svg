<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>WanGP Video Browser</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1a1e26"/>
      <stop offset="0.55" stop-color="#111418"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="takeA" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e2672a"/>
      <stop offset="1" stop-color="#b8431a"/>
    </linearGradient>
    <linearGradient id="takeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a414d"/>
      <stop offset="1" stop-color="#23282f"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.28" cy="0.14" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <clipPath id="screen">
      <rect x="96" y="136" width="320" height="240" rx="34"/>
    </clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" rx="112" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#sweep)"/>
  </g>

  <!-- One screen, two takes: the seam grip is the wipe divider you drag in the
       app, the play triangle marks the left take. -->
  <g filter="url(#lift)">
    <rect x="96" y="136" width="320" height="240" rx="34" fill="url(#takeB)"/>
    <g clip-path="url(#screen)">
      <rect x="96" y="136" width="196" height="240" fill="url(#takeA)"/>
      <rect x="96" y="136" width="196" height="240" fill="#ffffff" opacity="0.045"/>
      <path d="M172 228 l0 56 46 -28 z" fill="#f5f6f8" opacity="0.9"/>
    </g>
    <rect x="96" y="136" width="320" height="240" rx="34" fill="none" stroke="#f5f6f8"
          stroke-opacity="0.92" stroke-width="13"/>
    <rect x="284.5" y="136" width="7" height="240" fill="#0b0c0e" opacity="0.55"/>
    <circle cx="288" cy="256" r="28" fill="#f5f6f8"/>
    <circle cx="288" cy="256" r="28" fill="none" stroke="#b8431a" stroke-width="5.5"/>
    <rect x="285.5" y="240" width="5" height="32" rx="2.5" fill="#b8431a"/>
  </g>
</svg>
